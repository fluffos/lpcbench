# Snippet for throne's system nginx (/etc/nginx/sites-available/default or /etc/nginx/conf.d/)
# To bind directly to http://throne/ or https://throne/:

location /lpc/ {
    alias /opt/lpcbench/web/;
    index index.html;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;
}

location /evaluate {
    proxy_pass http://127.0.0.1:8081/evaluate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
